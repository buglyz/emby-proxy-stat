<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emby Proxy Toolbox | 动态流媒体反向代理控制台</title>
    <style>
        :root {
            --bg-base: #090d14;
            --bg-surface: #101622;
            --bg-surface-hover: #151d2d;
            --bg-input: #070a10;
            --border-subtle: rgba(255, 255, 255, 0.07);
            --border-default: rgba(255, 255, 255, 0.13);
            --border-focus: #3b82f6;

            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --emerald: #10b981;
            --emerald-bg: rgba(16, 185, 129, 0.1);
            --emerald-border: rgba(16, 185, 129, 0.25);
            --purple: #a855f7;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --rose-bg: rgba(244, 63, 94, 0.1);

            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;

            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;

            --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.03);
            --shadow-card-hover: 0 8px 30px -4px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            background-image:
                radial-gradient(ellipse 90% 40% at 50% -10%, rgba(59, 130, 246, 0.12), transparent),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.05), transparent 35%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px calc(40px + env(safe-area-inset-bottom, 0px));
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 全局焦点无障碍轮廓 */
        :focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        button:focus:not(:focus-visible),
        input:focus:not(:focus-visible) {
            outline: none;
        }

        .container {
            width: 100%;
            max-width: 980px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 顶部导航 Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, #2563eb, #10b981);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
            flex-shrink: 0;
            transition: transform 0.2s var(--ease-out-expo);
        }

        .brand-icon:hover {
            transform: scale(1.04);
        }

        .brand-title h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-title p {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 1px;
        }

        .header-tools {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: var(--radius-full);
            background: var(--emerald-bg);
            border: 1px solid var(--emerald-border);
            color: var(--emerald);
            font-size: 12px;
            font-weight: 600;
            user-select: none;
            transition: all 0.2s ease;
        }

        .badge-status.inactive {
            background: rgba(100, 116, 139, 0.1);
            border-color: rgba(100, 116, 139, 0.2);
            color: var(--text-muted);
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--emerald);
            box-shadow: 0 0 8px var(--emerald);
            animation: pulse-ring 2s infinite var(--ease-out-expo);
            flex-shrink: 0;
        }

        .badge-status.inactive .pulse-dot {
            background-color: var(--text-muted);
            box-shadow: none;
            animation: none;
        }

        @keyframes pulse-ring {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.85); }
        }

        .btn-header {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-default);
            color: var(--text-secondary);
            padding: 7px 13px;
            min-height: 36px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            user-select: none;
        }

        .btn-header:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.22);
            transform: translateY(-1px);
        }

        .btn-header:active {
            transform: translateY(0);
        }

        .btn-header.danger:hover {
            background: var(--rose-bg);
            color: #fb7185;
            border-color: rgba(244, 63, 94, 0.35);
        }

        .btn-header.loading {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none !important;
        }

        /* 统一卡片 */
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            transition: border-color 0.2s var(--ease-out-expo), box-shadow 0.2s var(--ease-out-expo), transform 0.2s var(--ease-out-expo);
        }

        .card:hover {
            border-color: var(--border-default);
            box-shadow: var(--shadow-card-hover);
        }

        .card-header {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(255, 255, 255, 0.015);
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        .card-title-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }

        .card-extra {
            font-size: 12px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* 切换 Tabs */
        .chart-tabs {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.035);
            padding: 3px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
            gap: 2px;
        }

        .chart-tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            min-height: 24px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.18s ease;
            user-select: none;
        }

        .chart-tab-btn:hover:not(.active) {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .chart-tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
        }

        /* 核心数据网格 (4 卡片) */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .stat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: var(--shadow-card);
            transition: transform 0.2s var(--ease-out-expo), border-color 0.2s var(--ease-out-expo), box-shadow 0.2s var(--ease-out-expo);
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-default);
            box-shadow: var(--shadow-card-hover);
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: transparent;
            transition: background 0.3s ease;
        }

        .stat-card:nth-child(1):hover::after { background: var(--emerald); }
        .stat-card:nth-child(2):hover::after { background: var(--purple); }
        .stat-card:nth-child(3):hover::after { background: var(--primary); }
        .stat-card:nth-child(4):hover::after { background: var(--amber); }

        .stat-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-card-title {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-icon {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s var(--ease-out-expo);
        }

        .stat-card:hover .stat-icon {
            transform: scale(1.08);
        }

        .icon-emerald { color: #34d399; background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.25); }
        .icon-purple { color: #c084fc; background: rgba(168, 85, 247, 0.12); border: 1px solid rgba(168, 85, 247, 0.25); }
        .icon-blue { color: #60a5fa; background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(59, 130, 246, 0.25); }
        .icon-amber { color: #fbbf24; background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.25); }

        .stat-card-value {
            font-size: 26px;
            font-weight: 700;
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
            color: var(--text-main);
            line-height: 1.15;
            min-height: 30px;
            display: flex;
            align-items: center;
        }

        .stat-card-footer {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 18px;
        }

        .stat-card-footer strong {
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }

        /* 骨架屏微光样式 */
        @keyframes shimmer-sweep {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .skeleton {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.03) 25%, rgba(255, 255, 255, 0.09) 50%, rgba(255, 255, 255, 0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer-sweep 1.8s infinite ease-in-out;
            border-radius: var(--radius-sm);
            color: transparent !important;
            user-select: none;
            display: inline-block;
        }

        .stat-card-value.skeleton {
            width: 80px;
            height: 28px;
        }

        .stat-card-footer strong.skeleton {
            width: 60px;
            height: 14px;
        }

        /* 扇形图分布卡片主体 */
        .chart-card-body {
            padding: 22px 24px;
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr);
            gap: 28px;
            align-items: center;
            min-width: 0;
        }

        .chart-visual-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .donut-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            overflow: visible;
        }

        .donut-slice {
            cursor: pointer;
            transition: transform 0.22s var(--ease-out-expo), opacity 0.18s ease, filter 0.18s ease;
            transform-origin: 110px 110px;
        }

        .donut-slice:hover, .donut-slice.active {
            transform: scale(1.05);
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.25));
            opacity: 1 !important;
        }

        .chart-center-info {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            text-align: center;
            padding: 12px;
        }

        .chart-center-val {
            font-size: 26px;
            font-weight: 700;
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            color: var(--text-main);
            line-height: 1.1;
        }

        .chart-center-label {
            font-size: 11px;
            color: var(--text-muted);
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-top: 3px;
        }

        /* 结构化图例排行列表 */
        .legend-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .legend-item {
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            transition: all 0.18s var(--ease-out-expo);
            overflow: hidden;
        }

        .legend-item:hover, .legend-item.active {
            background: var(--bg-surface-hover);
            border-color: var(--border-default);
            transform: translateX(3px);
        }

        .legend-row-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .legend-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .legend-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
            gap: 2px;
        }

        .legend-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .legend-sub {
            font-size: 11px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .legend-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .legend-count {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            font-size: 13px;
            font-weight: 600;
            color: var(--emerald);
        }

        .legend-percent {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            font-size: 12px;
            color: var(--text-secondary);
            width: 48px;
            text-align: right;
        }

        /* 图例条目的占比进度横条 */
        .legend-track-bar {
            width: 100%;
            height: 3px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .legend-fill-bar {
            height: 100%;
            border-radius: var(--radius-full);
            transition: width 0.4s var(--ease-out-expo);
        }

        /* 统一空状态设计 */
        .empty-state-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 36px 20px;
            text-align: center;
            gap: 8px;
            color: var(--text-muted);
            grid-column: span 2;
            width: 100%;
        }

        .empty-state-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            margin-bottom: 2px;
            opacity: 0.85;
        }

        .empty-state-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .empty-state-desc {
            font-size: 11px;
            color: var(--text-muted);
            max-width: 280px;
            line-height: 1.4;
        }

        .empty-inline {
            padding: 24px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        /* 骨架占位列表条目 */
        .skeleton-item {
            height: 52px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            animation: shimmer-sweep 1.8s infinite ease-in-out;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.02) 25%, rgba(255, 255, 255, 0.06) 50%, rgba(255, 255, 255, 0.02) 75%);
            background-size: 200% 100%;
        }

        /* 反代生成器工具条 */
        .tool-body {
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tool-input-row {
            display: flex;
            gap: 10px;
        }

        .tool-input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            min-height: 40px;
        }

        .tool-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .btn-generate {
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            padding: 10px 20px;
            min-height: 40px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
            user-select: none;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }

        .btn-generate:hover {
            background: var(--primary-hover);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .btn-generate:active {
            transform: scale(0.98);
        }

        .tool-result-row {
            background: var(--bg-input);
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            animation: fadeIn 0.2s var(--ease-out-expo);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tool-result-url {
            font-family: var(--font-mono);
            font-size: 13px;
            color: #60a5fa;
            word-break: break-all;
            user-select: all;
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-default);
            color: var(--text-main);
            padding: 7px 14px;
            min-height: 36px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            user-select: none;
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.22);
        }

        .btn-copy.copied {
            background: var(--emerald-bg);
            border-color: var(--emerald-border);
            color: var(--emerald);
        }

        /* 登录卡片 */
        .login-card {
            width: 100%;
            max-width: 380px;
            margin: 80px auto;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 32px 28px;
            box-shadow: 0 20px 50px -6px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.25s var(--ease-out-expo);
        }

        .login-head {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .login-head-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, #2563eb, #10b981);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
        }

        .login-head h2 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        .login-head p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .login-error-box {
            background: var(--rose-bg);
            border: 1px solid rgba(244, 63, 94, 0.25);
            color: #fb7185;
            font-size: 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            display: none;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.15s ease;
        }

        /* 实时会话 */
        .session-list {
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .session-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            transition: border-color 0.2s var(--ease-out-expo), background 0.2s var(--ease-out-expo);
        }

        .session-item.is-active {
            border-color: rgba(16, 185, 129, 0.3);
            background: linear-gradient(90deg, rgba(16, 185, 129, 0.05) 0%, var(--bg-input) 40%);
        }

        .session-item:hover {
            border-color: var(--border-default);
            background: var(--bg-surface-hover);
        }

        .session-main {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .session-device {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .session-host {
            font-size: 11px;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .session-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .session-status {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            padding: 3px 8px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.03);
        }

        .session-status.on {
            color: var(--emerald);
            background: var(--emerald-bg);
            border: 1px solid var(--emerald-border);
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: var(--radius-full);
            background: var(--emerald);
            box-shadow: 0 0 6px var(--emerald);
            animation: pulse-ring 1.8s infinite var(--ease-out-expo);
        }

        .session-ago {
            font-size: 11px;
            color: var(--text-muted);
            min-width: 46px;
            text-align: right;
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
        }

        /* 流量分布 */
        #breakdown-list {
            padding: 16px 20px;
        }

        /* 趋势图 */
        .trend-chart-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            padding: 12px 16px 16px;
        }

        .trend-svg {
            width: 100%;
            height: auto;
            display: block;
            overflow: hidden;
        }

        .trend-legend {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .trend-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .trend-chip-swatch {
            width: 10px;
            height: 10px;
            border-radius: 3px;
        }

        /* 全局 Toast */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast-item {
            background: #151d2d;
            border: 1px solid var(--border-default);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
            padding: 10px 16px;
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
            transform: translateY(12px) scale(0.96);
            opacity: 0;
            transition: transform 0.22s var(--ease-out-expo), opacity 0.2s ease;
        }

        .toast-item.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .toast-item.success { border-color: rgba(16, 185, 129, 0.4); }
        .toast-item.success svg { color: var(--emerald); }
        .toast-item.error { border-color: rgba(244, 63, 94, 0.4); }
        .toast-item.error svg { color: var(--rose); }

        .footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            padding-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            user-select: none;
        }

        /* 移动端适配与响应式规则 */
        @media (max-width: 768px) {
            body {
                padding: 14px 12px calc(30px + env(safe-area-inset-bottom, 0px));
            }

            .container {
                gap: 16px;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 14px;
            }

            .header-tools {
                justify-content: space-between;
                width: 100%;
                flex-wrap: nowrap;
                gap: 8px;
            }

            .badge-status {
                padding: 5px 10px;
                font-size: 11px;
            }

            .btn-header {
                padding: 6px 10px;
                font-size: 12px;
            }

            /* 移动端 4 核心指标保持 2×2 网格 */
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .stat-card {
                padding: 14px 16px;
                gap: 8px;
            }

            .stat-card-value {
                font-size: 20px;
                min-height: 24px;
            }

            .stat-card-footer {
                font-size: 11px;
            }

            .chart-card-body {
                grid-template-columns: minmax(0, 1fr);
                gap: 20px;
                padding: 16px;
                min-width: 0;
            }

            .legend-list, #breakdown-list {
                min-width: 0;
                width: 100%;
            }

            .legend-item {
                min-width: 0;
                width: 100%;
                padding: 10px 12px;
            }

            .legend-row-top {
                min-width: 0;
                width: 100%;
                gap: 8px;
            }

            .legend-left {
                min-width: 0;
                flex: 1;
            }

            .legend-name {
                max-width: 160px;
            }

            .legend-right {
                flex-shrink: 0;
                gap: 8px;
            }

            .legend-percent {
                width: 42px;
            }

            /* 移动端输入框保持 16px 字号，防 iOS Safari 聚焦自动缩放页面 */
            .tool-input {
                font-size: 16px;
            }

            .tool-input-row {
                flex-direction: column;
            }

            .tool-result-row {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-copy {
                justify-content: center;
            }

            .card-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
                padding: 12px 16px;
            }

            .card-extra {
                width: 100%;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 8px;
            }

            .session-list, #breakdown-list, .tool-body {
                padding: 12px 14px;
            }

            #toast-container {
                left: 16px;
                right: 16px;
                bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            }
        }

        /* 极窄屏（≤ 420px）下的紧凑微调 */
        @media (max-width: 420px) {
            .btn-tg-text {
                display: none;
            }
            .header-tools {
                gap: 6px;
            }
            .btn-header {
                padding: 6px 8px;
            }
        }
    </style>
</head>

                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        <span id="copy-text">复制链接</span>
                    </button>
                </div>
            </div>
        </section>

        <footer class="footer">
            <span>Emby Proxy Gateway</span>
            <span>&bull;</span>
            <span>High Performance Go Engine</span>
        </footer>
    </div>

    <!-- 全局 Toast 容器 -->
    <div id="toast-container" aria-live="polite"></div>

    <script>
        // 现代暗黑调色板 (7级循环渐变)
        const PALETTE = [
            '#10b981', // 翡翠绿
            '#3b82f6', // 赛博蓝
            '#a855f7', // 紫晶色
            '#f59e0b', // 琥珀黄
            '#06b6d4', // 天空青
            '#f43f5e', // 珊瑚红
            '#8b5cf6'  // 靛青色
        ];

        let currentClientsData = [];
        let currentChartMode = 'device'; // 'device' | 'host'
        let breakdownData = null;
        let breakdownMode = 'client';
        let isFirstStatsRender = true;
        let trendPointsCache = null;

        // Toast 消息浮层
        function showToast(text, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const el = document.createElement('div');
            el.className = 'toast-item ' + type;

            let iconSvg = '';
            if (type === 'success') {
                iconSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
            } else if (type === 'error') {
                iconSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>';
            } else {
                iconSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>';
            }

            el.innerHTML = iconSvg + '<span>' + escapeHtml(text) + '</span>';
            container.appendChild(el);

            requestAnimationFrame(() => {
                el.classList.add('show');
            });

            setTimeout(() => {
                el.classList.remove('show');
                setTimeout(() => {
                    if (el.parentNode) el.parentNode.removeChild(el);
                }, 220);
            }, 3000);
        }

        // XSS 字符转义
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        // 数字缓动滚动动画 (只在初次加载时播报)
        function animateCount(el, start, end, duration = 600, suffix = '') {
            if (!el) return;
            if (start === end || isNaN(end)) {
                el.textContent = (end || 0).toLocaleString() + suffix;
                return;
            }
            const startTime = performance.now();
            function update(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                // easeOutCubic
                const ease = 1 - Math.pow(1 - progress, 3);
                const current = Math.round(start + (end - start) * ease);
                el.textContent = current.toLocaleString() + suffix;
                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    el.textContent = end.toLocaleString() + suffix;
                }
            }
            requestAnimationFrame(update);
        }

        // 格式化字节
        function formatBytesCompact(bytes) {
            if (!bytes || bytes <= 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            const val = (bytes / Math.pow(k, i)).toFixed(1);
            return val + ' ' + sizes[i];
        }

        // 鉴权检查与周期刷新
        async function checkAuthAndLoad() {
            try {
                const res = await fetch('/api/stats');
                if (res.status === 401) {
                    showLogin();
                    return;
                }
                if (res.ok) {
                    showDashboard();
                    const data = await res.json();
                    renderStats(data);
                    loadClients();
                    loadSessions();
                    loadBreakdown();
                    loadTrend();
                } else {
                    renderStatsError();
                }
            } catch (e) {
                console.error('加载状态失败:', e);
                renderStatsError();
            }
        }

        function showLogin() {
            const lv = document.getElementById('login-view');
            const dv = document.getElementById('dashboard-view');
            if (lv) lv.style.display = 'flex';
            if (dv) dv.style.display = 'none';
        }

        function showDashboard() {
            const lv = document.getElementById('login-view');
            const dv = document.getElementById('dashboard-view');
            if (lv) lv.style.display = 'none';
            if (dv) dv.style.display = 'flex';
        }

        function renderStatsError() {
            const badge = document.getElementById('gateway-status-badge');
            if (badge) {
                badge.classList.add('inactive');
                badge.innerHTML = '<span class="pulse-dot" style="background:#f43f5e;box-shadow:none;"></span><span>连接异常</span>';
            }
        }

        function renderStats(data) {
            const badge = document.getElementById('gateway-status-badge');
            if (badge) {
                badge.classList.remove('inactive');
                badge.innerHTML = '<span class="pulse-dot"></span><span>网关在线</span>';
            }

            const elTodayPlays = document.getElementById('val-today-plays');
            const elTotalPlays = document.getElementById('val-total-plays');
            const elTodayTraffic = document.getElementById('val-today-traffic');
            const elTotalTraffic = document.getElementById('val-total-traffic');
            const elTodayClients = document.getElementById('val-today-clients');
            const elTotalClients = document.getElementById('val-total-clients');
            const elTodayHosts = document.getElementById('val-today-hosts');
            const elTotalHosts = document.getElementById('val-total-hosts');

            // 移除骨架状态类
            [elTodayPlays, elTotalPlays, elTodayTraffic, elTotalTraffic, elTodayClients, elTotalClients, elTodayHosts, elTotalHosts].forEach(el => {
                if (el) el.classList.remove('skeleton');
            });

            if (isFirstStatsRender) {
                animateCount(elTodayPlays, 0, data.today_plays || 0);
                animateCount(elTotalPlays, 0, data.total_plays || 0, 600, ' 次');
                animateCount(elTodayClients, 0, data.today_clients || 0);
                animateCount(elTotalClients, 0, data.total_clients || 0, 600, ' 个');
                animateCount(elTodayHosts, 0, data.today_hosts || 0);
                animateCount(elTotalHosts, 0, data.total_hosts || 0, 600, ' 个');
                if (elTodayTraffic) elTodayTraffic.textContent = data.today_traffic_fmt || '0 B';
                if (elTotalTraffic) elTotalTraffic.textContent = data.total_traffic_fmt || '0 B';
                isFirstStatsRender = false;
            } else {
                if (elTodayPlays) elTodayPlays.textContent = (data.today_plays || 0).toLocaleString();
                if (elTotalPlays) elTotalPlays.textContent = (data.total_plays || 0).toLocaleString() + ' 次';
                if (elTodayTraffic) elTodayTraffic.textContent = data.today_traffic_fmt || '0 B';
                if (elTotalTraffic) elTotalTraffic.textContent = data.total_traffic_fmt || '0 B';
                if (elTodayClients) elTodayClients.textContent = (data.today_clients || 0).toLocaleString();
                if (elTotalClients) elTotalClients.textContent = (data.total_clients || 0).toLocaleString() + ' 个';
                if (elTodayHosts) elTodayHosts.textContent = (data.today_hosts || 0).toLocaleString();
                if (elTotalHosts) elTotalHosts.textContent = (data.total_hosts || 0).toLocaleString() + ' 个';
            }

            if (data.date) {
                const dateBadge = document.getElementById('stat-date-badge');
                if (dateBadge) dateBadge.textContent = '统计周期: ' + data.date;
            }
        }

        async function loadClients() {
            try {
                const res = await fetch('/api/clients');
                if (res.status === 401) {
                    showLogin();
                    return;
                }
                if (res.ok) {
                    const data = await res.json();
                    currentClientsData = data.clients || [];
                    renderDonutChart();
                } else {
                    renderClientsError();
                }
            } catch (e) {
                console.error('加载客户端失败:', e);
                renderClientsError();
            }
        }

        function renderClientsError() {
            const legendList = document.getElementById('legend-list');
            if (legendList) {
                legendList.innerHTML = '<div class="empty-inline">' +
                    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                    '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>' +
                    '</svg><span>分布数据加载失败，8 秒后重试</span></div>';
            }
        }

        function switchChartMode(mode) {
            currentChartMode = mode;
            const tabDev = document.getElementById('tab-dev');
            const tabHost = document.getElementById('tab-host');
            if (tabDev) {
                tabDev.classList.toggle('active', mode === 'device');
                tabDev.setAttribute('aria-selected', mode === 'device');
            }
            if (tabHost) {
                tabHost.classList.toggle('active', mode === 'host');
                tabHost.setAttribute('aria-selected', mode === 'host');
            }
            renderDonutChart();
        }

        // 绘制原生 SVG 扇形环形图与图例
        function renderDonutChart() {
            const svg = document.getElementById('donut-svg');
            const legendList = document.getElementById('legend-list');
            const centerVal = document.getElementById('center-plays-val');
            const centerLabel = document.getElementById('center-plays-label');
            if (!svg || !legendList || !centerVal || !centerLabel) return;

            if (!currentClientsData || currentClientsData.length === 0) {
                svg.innerHTML = '<circle cx="110" cy="110" r="69" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="30" stroke-dasharray="6 6"></circle>';
                legendList.innerHTML = '<div class="empty-state-box">' +
                    '<div class="empty-state-icon">' +
                    '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                    '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>' +
                    '</svg></div>' +
                    '<div class="empty-state-title">今日暂无设备播放记录</div>' +
                    '<div class="empty-state-desc">有客户端发起媒体点播流请求时将自动生成占比分布</div>' +
                    '</div>';
                centerVal.textContent = '0';
                centerLabel.textContent = '今日无播放';
                window._currentChartGroups = [];
                window._totalPlays = 0;
                return;
            }

            // 1. 聚合分组数据
            const groupMap = {};
            let totalPlays = 0;

            currentClientsData.forEach(item => {
                const key = currentChartMode === 'device' ? (item.device_name || '未知设备') : (item.target_host || '未知节点');
                if (!groupMap[key]) {
                    groupMap[key] = {
                        name: key,
                        count: 0,
                        subInfo: currentChartMode === 'device' ? (item.client_ip || '未知IP') : ((item.play_count || 0) + ' 次播放')
                    };
                }
                groupMap[key].count += (item.play_count || 0);
                totalPlays += (item.play_count || 0);
            });

            const groups = Object.values(groupMap).sort((a, b) => b.count - a.count);

            centerVal.textContent = totalPlays.toLocaleString();
            centerLabel.textContent = currentChartMode === 'device' ? '今日总播放' : '节点总请求';

            // 2. 绘制 SVG 环形切片（带底环）
            const cx = 110, cy = 110, R = 84, r = 54;
            let currentAngle = 0;
            let svgPaths = '<circle cx="110" cy="110" r="69" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="30" />';
            let legendHTML = '';

            groups.forEach((g, idx) => {
                const color = PALETTE[idx % PALETTE.length];
                const fraction = totalPlays > 0 ? (g.count / totalPlays) : 0;
                const percentText = (fraction * 100).toFixed(1) + '%';
                const angle = fraction * 2 * Math.PI;

                if (groups.length === 1) {
                    svgPaths += '<circle class="donut-slice" data-idx="' + idx + '" cx="110" cy="110" r="69" fill="none" stroke="' + color + '" stroke-width="30" />';
                } else if (angle > 0.001) {
                    const startAngle = currentAngle;
                    const endAngle = currentAngle + angle;

                    // 弧度微缝隙间距 (0.015 rad)
                    const gap = 0.015;
                    const a1 = startAngle + gap / 2;
                    const a2 = endAngle - gap / 2;

                    const x1 = cx + R * Math.cos(a1);
                    const y1 = cy + R * Math.sin(a1);
                    const x2 = cx + R * Math.cos(a2);
                    const y2 = cy + R * Math.sin(a2);

                    const x3 = cx + r * Math.cos(a2);
                    const y3 = cy + r * Math.sin(a2);
                    const x4 = cx + r * Math.cos(a1);
                    const y4 = cy + r * Math.sin(a1);

                    const largeArc = (a2 - a1) > Math.PI ? 1 : 0;

                    const d = [
                        'M', x1.toFixed(2), y1.toFixed(2),
                        'A', R, R, 0, largeArc, 1, x2.toFixed(2), y2.toFixed(2),
                        'L', x3.toFixed(2), y3.toFixed(2),
                        'A', r, r, 0, largeArc, 0, x4.toFixed(2), y4.toFixed(2),
                        'Z'
                    ].join(' ');

                    svgPaths += '<path class="donut-slice" data-idx="' + idx + '" d="' + d + '" fill="' + color + '" />';
                    currentAngle = endAngle;
                }

                // 3. 生成对应图例条目 (含底部占比条)
                legendHTML += '<div class="legend-item" data-idx="' + idx + '" onmouseenter="highlightSlice(' + idx + ')" onmouseleave="unhighlightSlice()">' +
                    '<div class="legend-row-top">' +
                    '<div class="legend-left">' +
                    '<span class="legend-dot" style="background-color: ' + color + '; box-shadow: 0 0 8px ' + color + '55;"></span>' +
                    '<div class="legend-info">' +
                    '<span class="legend-name" title="' + escapeHtml(g.name) + '">' + escapeHtml(g.name) + '</span>' +
                    '<span class="legend-sub">' + (currentChartMode === 'device' ? 'IP: ' + escapeHtml(g.subInfo) : '目标服务节点') + '</span>' +
                    '</div></div>' +
                    '<div class="legend-right">' +
                    '<span class="legend-count">' + g.count.toLocaleString() + ' 次</span>' +
                    '<span class="legend-percent">' + percentText + '</span>' +
                    '</div></div>' +
                    '<div class="legend-track-bar">' +
                    '<div class="legend-fill-bar" style="width: ' + percentText + '; background-color: ' + color + ';"></div>' +
                    '</div></div>';
            });

            svg.innerHTML = svgPaths;
            legendList.innerHTML = legendHTML;

            // 给切片绑定悬浮联动事件
            svg.querySelectorAll('.donut-slice').forEach(slice => {
                slice.addEventListener('mouseenter', () => {
                    const idx = parseInt(slice.getAttribute('data-idx'), 10);
                    highlightSlice(idx);
                });
                slice.addEventListener('mouseleave', unhighlightSlice);
            });

            window._currentChartGroups = groups;
            window._totalPlays = totalPlays;
        }

        function highlightSlice(idx) {
            const groups = window._currentChartGroups;
            if (!groups || !groups[idx]) return;

            const g = groups[idx];
            const centerVal = document.getElementById('center-plays-val');
            const centerLabel = document.getElementById('center-plays-label');

            if (centerVal) centerVal.textContent = g.count.toLocaleString();
            if (centerLabel) centerLabel.textContent = g.name;

            document.querySelectorAll('.donut-slice').forEach(el => {
                const elIdx = parseInt(el.getAttribute('data-idx'), 10);
                if (elIdx === idx) {
                    el.classList.add('active');
                } else {
                    el.style.opacity = '0.3';
                }
            });

            document.querySelectorAll('#legend-list .legend-item').forEach(el => {
                const elIdx = parseInt(el.getAttribute('data-idx'), 10);
                el.classList.toggle('active', elIdx === idx);
            });
        }

        function unhighlightSlice() {
            const centerVal = document.getElementById('center-plays-val');
            const centerLabel = document.getElementById('center-plays-label');
            const total = window._totalPlays || 0;

            if (centerVal) centerVal.textContent = total.toLocaleString();
            if (centerLabel) centerLabel.textContent = currentChartMode === 'device' ? '今日总播放' : '节点总请求';

            document.querySelectorAll('.donut-slice').forEach(el => {
                el.classList.remove('active');
                el.style.opacity = '1';
            });

            document.querySelectorAll('#legend-list .legend-item').forEach(el => {
                el.classList.remove('active');
            });
        }

        // ============ 实时会话 ============
        async function loadSessions() {
            try {
                const res = await fetch('/api/sessions');
                if (res.status === 401 || !res.ok) return;
                renderSessions(await res.json());
            } catch (e) {
                console.error('加载会话失败:', e);
                const list = document.getElementById('session-list');
                if (list) {
                    list.innerHTML = '<div class="empty-inline">' +
                        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                        '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>' +
                        '</svg><span>实时会话获取失败，8 秒后重试</span></div>';
                }
            }
        }

        function renderSessions(data) {
            const count = document.getElementById('live-active-count');
            const list = document.getElementById('session-list');
            const badge = document.getElementById('badge-session-count');
            if (!count || !list) return;

            const activeNum = data.active || 0;
            count.textContent = activeNum;
            if (badge) {
                if (activeNum > 0) {
                    badge.classList.remove('inactive');
                } else {
                    badge.classList.add('inactive');
                }
            }

            const sessions = (data.sessions || []).slice()
                .sort((a, b) => (b.active - a.active) || (a.last_seen_seconds_ago - b.last_seen_seconds_ago))
                .slice(0, 20);

            if (!sessions.length) {
                list.innerHTML = '<div class="empty-state-box">' +
                    '<div class="empty-state-icon">' +
                    '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                    '<polygon points="5 3 19 12 5 21 5 3"></polygon>' +
                    '</svg></div>' +
                    '<div class="empty-state-title">当前暂无活跃观看会话</div>' +
                    '<div class="empty-state-desc">最近 2 分钟内未检测到流媒体数据请求传输</div>' +
                    '</div>';
                return;
            }

            list.innerHTML = sessions.map(s => {
                const isActive = !!s.active;
                const status = isActive
                    ? '<span class="session-status on"><span class="live-dot"></span>观看中</span>'
                    : '<span class="session-status">最近观看</span>';
                return '<div class="session-item ' + (isActive ? 'is-active' : '') + '">' +
                    '<div class="session-main">' +
                    '<span class="session-device" title="' + escapeHtml(s.device_name || '未知设备') + '">' + escapeHtml(s.device_name || '未知设备') + '</span>' +
                    '<span class="session-host">' + escapeHtml(s.target_host || '') + ' &middot; 内容 ' + escapeHtml(String(s.item_id !== undefined ? s.item_id : '-')) + '</span>' +
                    '</div>' +
                    '<div class="session-meta">' + status +
                    '<span class="session-ago">' + (s.last_seen_seconds_ago !== undefined ? s.last_seen_seconds_ago : 0) + 's 前</span>' +
                    '</div></div>';
            }).join('');
        }

        // ============ 流量分布 ============
        async function loadBreakdown() {
            try {
                const res = await fetch('/api/traffic-breakdown');
                if (res.status === 401 || !res.ok) return;
                breakdownData = await res.json();
                renderBreakdown();
            } catch (e) {
                console.error('加载流量分布失败:', e);
                const list = document.getElementById('breakdown-list');
                if (list) {
                    list.innerHTML = '<div class="empty-inline">' +
                        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                        '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>' +
                        '</svg><span>流量分布数据获取异常，8 秒后重试</span></div>';
                }
            }
        }

        function switchBreakdownMode(mode) {
            breakdownMode = mode;
            const btnClient = document.getElementById('tbd-client');
            const btnHost = document.getElementById('tbd-host');
            if (btnClient) {
                btnClient.classList.toggle('active', mode === 'client');
                btnClient.setAttribute('aria-selected', mode === 'client');
            }
            if (btnHost) {
                btnHost.classList.toggle('active', mode === 'host');
                btnHost.setAttribute('aria-selected', mode === 'host');
            }
            renderBreakdown();
        }

        function renderBreakdown() {
            const list = document.getElementById('breakdown-list');
            if (!list) return;
            if (!breakdownData) {
                list.innerHTML = '<div class="empty-state-box">' +
                    '<div class="empty-state-icon">' +
                    '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                    '<line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line>' +
                    '</svg></div>' +
                    '<div class="empty-state-title">今日暂无流量数据</div>' +
                    '<div class="empty-state-desc">客户端流转数据发生后将在此分类汇集</div>' +
                    '</div>';
                return;
            }
            const rows = breakdownMode === 'client' ? (breakdownData.by_client || []) : (breakdownData.by_host || []);
            if (!rows.length) {
                list.innerHTML = '<div class="empty-state-box">' +
                    '<div class="empty-state-icon">' +
                    '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                    '<line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line>' +
                    '</svg></div>' +
                    '<div class="empty-state-title">今日暂无流量记录</div>' +
                    '<div class="empty-state-desc">当前分类下暂无已记录的流量消耗条目</div>' +
                    '</div>';
                return;
            }

            const totalBytes = rows.reduce((sum, r) => sum + (r.bytes || 0), 0) || 1;
            const label = breakdownMode === 'client' ? '客户端 IP' : '目标节点';

            list.innerHTML = rows.slice(0, 15).map((r, idx) => {
                const color = PALETTE[idx % PALETTE.length];
                const fraction = (r.bytes || 0) / totalBytes;
                const percent = (fraction * 100).toFixed(1) + '%';
                return '<div class="legend-item">' +
                    '<div class="legend-row-top">' +
                    '<div class="legend-left">' +
                    '<span class="legend-dot" style="background-color: ' + color + '; box-shadow: 0 0 8px ' + color + '55;"></span>' +
                    '<div class="legend-info">' +
                    '<span class="legend-name" title="' + escapeHtml(r.key) + '">' + escapeHtml(r.key) + '</span>' +
                    '<span class="legend-sub">' + label + ' &middot; ' + (r.requests || 0).toLocaleString() + ' 次请求</span>' +
                    '</div></div>' +
                    '<div class="legend-right">' +
                    '<span class="legend-count">' + escapeHtml(r.bytes_fmt || '0 B') + '</span>' +
                    '<span class="legend-percent">' + percent + '</span>' +
                    '</div></div>' +
                    '<div class="legend-track-bar">' +
                    '<div class="legend-fill-bar" style="width: ' + percent + '; background-color: ' + color + ';"></div>' +
                    '</div></div>';
            }).join('');
        }

        // ============ 播放与流量趋势 ============
        async function loadTrend() {
            try {
                const res = await fetch('/api/trend?days=30');
                if (res.status === 401 || !res.ok) return;
                const data = await res.json();
                trendPointsCache = data.points || [];
                renderTrend(trendPointsCache);
            } catch (e) {
                console.error('加载趋势失败:', e);
                const svg = document.getElementById('trend-svg');
                if (svg) {
                    svg.innerHTML = '<text x="450" y="120" fill="#f43f5e" font-size="12" text-anchor="middle">趋势数据获取异常，稍后重试</text>';
                }
            }
        }

        function renderTrend(points) {
            const svg = document.getElementById('trend-svg');
            if (!svg) return;

            if (!points || !points.length) {
                svg.innerHTML = '<text x="450" y="120" fill="#64748b" font-size="13" text-anchor="middle">最近 30 天暂无历史统计数据</text>';
                return;
            }

            const W = 900, H = 240;
            const padL = 54, padR = 48, padT = 24, padB = 34;
            const innerW = W - padL - padR;
            const innerH = H - padT - padB;

            const maxBytes = Math.max.apply(null, points.map(p => p.bytes || 0).concat([1]));
            const maxPlays = Math.max.apply(null, points.map(p => p.plays || 0).concat([1]));

            const hasAnyData = points.some(p => (p.bytes > 0 || p.plays > 0));

            // 网格水平线与刻度
            let gridLines = '';
            const gridCount = 3;
            for (let g = 0; g <= gridCount; g++) {
                const y = padT + (innerH / gridCount) * g;
                const bytesVal = maxBytes * (1 - g / gridCount);
                const playsVal = Math.round(maxPlays * (1 - g / gridCount));

                gridLines += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) +
                    '" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3 4"/>';

                // 左侧刻度 (流量)
                gridLines += '<text x="' + (padL - 10) + '" y="' + (y + 3.5).toFixed(1) +
                    '" fill="#64748b" font-size="10" font-family="var(--font-mono)" text-anchor="end">' +
                    (hasAnyData ? formatBytesCompact(bytesVal) : '0 B') + '</text>';

                // 右侧刻度 (播放)
                gridLines += '<text x="' + (W - padR + 8) + '" y="' + (y + 3.5).toFixed(1) +
                    '" fill="#10b981" font-size="10" font-family="var(--font-mono)" text-anchor="start" opacity="0.8">' +
                    (hasAnyData ? playsVal : 0) + '</text>';
            }

            if (!hasAnyData) {
                svg.innerHTML = gridLines +
                    '<text x="450" y="' + (padT + innerH / 2 + 4) + '" fill="#64748b" font-size="13" font-weight="500" text-anchor="middle">最近 30 天暂无播放与流量记录</text>';
                return;
            }

            const step = innerW / points.length;
            const labelEvery = Math.max(1, Math.ceil(points.length / 8));

            let bars = '', labels = '', dots = '';
            const linePts = [];
            const areaPts = [];

            points.forEach((p, i) => {
                const x = padL + i * step;
                const bw = Math.max(step * 0.55, 3);
                const bh = (p.bytes > 0 && maxBytes > 0) ? Math.max(((p.bytes / maxBytes) * (innerH - 10)), 3) : 0;
                const barX = x + (step - bw) / 2;
                const barY = padT + innerH - bh;

                if (bh > 0) {
                    bars += '<rect class="trend-bar" data-idx="' + i + '" x="' + barX.toFixed(1) + '" y="' + barY.toFixed(1) +
                        '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="3" fill="url(#trend-bar-grad)" opacity="0.75" style="transition: opacity 0.15s ease;">' +
                        '<title>' + escapeHtml(p.date) + ' 流量 ' + escapeHtml(p.bytes_fmt || '0 B') + '</title></rect>';
                }

                const cx = x + step / 2;
                const cy = (maxPlays > 0 && p.plays > 0)
                    ? (padT + innerH - (p.plays / maxPlays) * (innerH - 20))
                    : (padT + innerH);

                linePts.push(cx.toFixed(1) + ',' + cy.toFixed(1));
                if (i === 0) {
                    areaPts.push(cx.toFixed(1) + ',' + (padT + innerH));
                }
                areaPts.push(cx.toFixed(1) + ',' + cy.toFixed(1));
                if (i === points.length - 1) {
                    areaPts.push(cx.toFixed(1) + ',' + (padT + innerH));
                }

                if (p.plays > 0) {
                    dots += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="3" fill="#10b981" stroke="#090d14" stroke-width="1.5"><title>' +
                        escapeHtml(p.date) + ' 播放 ' + (p.plays || 0) + ' 次</title></circle>';
                }

                if (i % labelEvery === 0 || i === points.length - 1) {
                    labels += '<text x="' + cx.toFixed(1) + '" y="' + (H - 10) + '" fill="#64748b" font-size="10" font-family="var(--font-mono)" text-anchor="middle">' +
                        escapeHtml(p.date ? p.date.slice(5) : '') + '</text>';
                }
            });

            svg.innerHTML =
                '<defs>' +
                '<linearGradient id="trend-bar-grad" x1="0" y1="0" x2="0" y2="1">' +
                '<stop offset="0%" stop-color="#60a5fa" stop-opacity="0.95"/>' +
                '<stop offset="100%" stop-color="#2563eb" stop-opacity="0.3"/>' +
                '</linearGradient>' +
                '<linearGradient id="trend-area-grad" x1="0" y1="0" x2="0" y2="1">' +
                '<stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>' +
                '<stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>' +
                '</linearGradient>' +
                '</defs>' +
                gridLines +
                bars +
                '<polygon points="' + areaPts.join(' ') + '" fill="url(#trend-area-grad)"/>' +
                '<polyline points="' + linePts.join(' ') + '" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>' +
                dots + labels +
                '<g id="trend-interactive" pointer-events="none" style="display:none;">' +
                '<line id="trend-crosshair" x1="0" y1="' + padT + '" x2="0" y2="' + (padT + innerH) + '" stroke="rgba(255,255,255,0.35)" stroke-dasharray="2 3"/>' +
                '<circle id="trend-highlight-dot" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>' +
                '</g>';

            // 悬停交互支持
            bindTrendInteraction(svg, points, padL, padR, padT, innerW, innerH, step);
        }

        function bindTrendInteraction(svg, points, padL, padR, padT, innerW, innerH, step) {
            const interactiveGroup = svg.querySelector('#trend-interactive');
            const crosshair = svg.querySelector('#trend-crosshair');
            const dot = svg.querySelector('#trend-highlight-dot');
            if (!interactiveGroup || !crosshair || !dot) return;

            function handleMove(e) {
                const rect = svg.getBoundingClientRect();
                const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
                const svgX = (clientX - rect.left) * (900 / rect.width);
                if (svgX < padL || svgX > (900 - padR)) {
                    interactiveGroup.style.display = 'none';
                    return;
                }
                const idx = Math.min(points.length - 1, Math.max(0, Math.floor((svgX - padL) / step)));
                const p = points[idx];
                if (!p) return;

                const cx = padL + idx * step + step / 2;
                const maxPlays = Math.max.apply(null, points.map(item => item.plays || 0).concat([1]));
                const cy = (maxPlays > 0 && p.plays > 0)
                    ? (padT + innerH - (p.plays / maxPlays) * (innerH - 20))
                    : (padT + innerH);

                crosshair.setAttribute('x1', cx);
                crosshair.setAttribute('x2', cx);
                dot.setAttribute('cx', cx);
                dot.setAttribute('cy', cy);
                interactiveGroup.style.display = 'block';

                svg.querySelectorAll('.trend-bar').forEach(b => {
                    const bIdx = parseInt(b.getAttribute('data-idx'), 10);
                    b.style.opacity = (bIdx === idx) ? '1' : '0.45';
                });
            }

            function handleLeave() {
                interactiveGroup.style.display = 'none';
                svg.querySelectorAll('.trend-bar').forEach(b => {
                    b.style.opacity = '0.75';
                });
            }

            svg.onmousemove = handleMove;
            svg.onmouseleave = handleLeave;
            svg.ontouchmove = handleMove;
            svg.ontouchend = handleLeave;
        }

        // 登录操作
        async function doLogin() {
            const uInput = document.getElementById('login-user');
            const pInput = document.getElementById('login-pass');
            const u = uInput ? uInput.value.trim() : '';
            const p = pInput ? pInput.value.trim() : '';
            const errBox = document.getElementById('login-error');
            const errText = document.getElementById('login-error-text');
            if (errBox) errBox.style.display = 'none';

            if (!u || !p) {
                if (errText) errText.textContent = '请输入管理员账号和密码';
                if (errBox) errBox.style.display = 'flex';
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: u, password: p})
                });
                const result = await res.json();
                if (result.success) {
                    showToast('登录成功', 'success');
                    isFirstStatsRender = true;
                    checkAuthAndLoad();
                } else {
                    if (errText) errText.textContent = result.message || '账号或密码错误';
                    if (errBox) errBox.style.display = 'flex';
                }
            } catch (e) {
                if (errText) errText.textContent = '登录网络异常，请稍后重试';
                if (errBox) errBox.style.display = 'flex';
            }
        }

        async function doLogout() {
            try {
                await fetch('/api/logout', {method: 'POST'});
            } catch(e) {}
            showToast('已安全退出', 'info');
            setTimeout(() => {
                location.reload();
            }, 500);
        }

        // 测试 Telegram 推送
        async function testTgPush() {
            const btn = document.getElementById('btn-tg');
            if (!btn || btn.classList.contains('loading')) return;

            btn.classList.add('loading');
            btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg> <span>发送中...</span>';

            try {
                const res = await fetch('/api/test-tg', {method: 'POST'});
                const data = await res.json();
                if (data.success) {
                    showToast('Telegram 测试报告已发送成功', 'success');
                } else {
                    showToast(data.message || '发送失败，请检查 Bot Token 或 Chat ID', 'error');
                }
            } catch(e) {
                showToast('网络请求失败', 'error');
            } finally {
                btn.classList.remove('loading');
                btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg> <span class="btn-tg-text">测试 TG 播报</span>';
            }
        }

        // 链接生成
        function generateLink() {
            const input = document.getElementById('target-input');
            if (!input) return;
            const val = input.value.trim();
            if (!val) {
                showToast('请输入原始 Emby/Jellyfin 地址', 'error');
                input.focus();
                return;
            }

            let clean = val;
            let protocol = 'http';

            if (clean.startsWith('https://')) {
                protocol = 'https';
                clean = clean.substring(8);
            } else if (clean.startsWith('http://')) {
                protocol = 'http';
                clean = clean.substring(7);
            }

            while (clean.endsWith('/')) {
                clean = clean.slice(0, -1);
            }

            const origin = window.location.origin;
            const result = origin + '/' + protocol + '://' + clean;
            const outUrl = document.getElementById('output-url');
            const outWrap = document.getElementById('output-wrapper');
            if (outUrl) outUrl.textContent = result;
            if (outWrap) outWrap.style.display = 'flex';
            showToast('代理链接生成成功', 'success');
        }

        // 复制链接
        function copyResult() {
            const outUrl = document.getElementById('output-url');
            const url = outUrl ? outUrl.textContent : '';
            if (!url) return;

            navigator.clipboard.writeText(url).then(() => {
                showToast('已复制到剪贴板', 'success');
                const copyBtn = document.getElementById('copy-btn');
                const copyText = document.getElementById('copy-text');
                if (copyText) copyText.textContent = '已复制';
                if (copyBtn) copyBtn.classList.add('copied');
                setTimeout(() => {
                    if (copyText) copyText.textContent = '复制链接';
                    if (copyBtn) copyBtn.classList.remove('copied');
                }, 2000);
            }).catch(() => {
                showToast('复制失败，请手动选择复制', 'error');
            });
        }

        // 绑定回车快捷键
        const passInput = document.getElementById('login-pass');
        if (passInput) {
            passInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') doLogin();
            });
        }
        const targetInput = document.getElementById('target-input');
        if (targetInput) {
            targetInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') generateLink();
            });
        }

        // 启动加载与定时刷新 (8s)
        checkAuthAndLoad();
        setInterval(checkAuthAndLoad, 8000);
    </script>
