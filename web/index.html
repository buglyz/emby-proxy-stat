<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emby Proxy Toolbox | 动态流媒体反向代理控制台</title>
    <style>
        :root {
            --bg-base: #090d14;
            --bg-surface: #101622;
            --bg-surface-hover: #151d2d;
            --bg-input: #070a10;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-default: rgba(255, 255, 255, 0.11);
            --border-focus: #3b82f6;

            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --emerald: #10b981;
            --emerald-bg: rgba(16, 185, 129, 0.1);
            --emerald-border: rgba(16, 185, 129, 0.25);
            --purple: #a855f7;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --rose-bg: rgba(244, 63, 94, 0.1);

            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;

            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;

            --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(ellipse 90% 40% at 50% -10%, rgba(59, 130, 246, 0.1), transparent),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.04), transparent 30%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 40px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 980px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 顶部导航 Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, #2563eb, #10b981);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
            flex-shrink: 0;
        }

        .brand-title h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }

        .brand-title p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .header-tools {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: var(--radius-full);
            background: var(--emerald-bg);
            border: 1px solid var(--emerald-border);
            color: var(--emerald);
            font-size: 12px;
            font-weight: 600;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--emerald);
            box-shadow: 0 0 8px var(--emerald);
            animation: pulse-ring 2s infinite ease-in-out;
        }

        @keyframes pulse-ring {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.8); }
        }

        .btn-header {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-default);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-header:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-header.danger:hover {
            background: var(--rose-bg);
            color: var(--rose);
            border-color: rgba(244, 63, 94, 0.3);
        }

        .btn-header.loading {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 统一卡片 */
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            transition: border-color 0.2s ease;
        }

        .card:hover {
            border-color: var(--border-default);
        }

        .card-header {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(255, 255, 255, 0.012);
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
        }

        .card-title svg {
            color: var(--primary);
        }

        .card-extra {
            font-size: 12px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* 切换 Tabs */
        .chart-tabs {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.04);
            padding: 3px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
            gap: 2px;
        }

        .chart-tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .chart-tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(59, 130, 246, 0.35);
        }

        /* 核心数据网格 (4 卡片) */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .stat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: var(--shadow-card);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-default);
        }

        .stat-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-card-title {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-icon {
            width: 30px;
            height: 30px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-emerald { color: #34d399; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); }
        .icon-purple { color: #c084fc; background: rgba(168, 85, 247, 0.1); border: 1px solid rgba(168, 85, 247, 0.2); }
        .icon-blue { color: #60a5fa; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); }
        .icon-amber { color: #fbbf24; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.2); }

        .stat-card-value {
            font-size: 24px;
            font-weight: 700;
            font-family: var(--font-mono);
            letter-spacing: -0.02em;
            color: var(--text-main);
            line-height: 1.1;
        }

        .stat-card-footer {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-card-footer strong {
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-weight: 600;
        }

        /* 扇形图分布卡片主体 */
        .chart-card-body {
            padding: 22px 24px;
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 28px;
            align-items: center;
        }

        .chart-visual-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .donut-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            overflow: visible;
        }

        .donut-slice {
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.15s ease;
            transform-origin: 110px 110px;
        }

        .donut-slice:hover, .donut-slice.active {
            transform: scale(1.05);
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.2));
            opacity: 1 !important;
        }

        .chart-center-info {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            text-align: center;
            padding: 12px;
        }

        .chart-center-val {
            font-size: 24px;
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--text-main);
            line-height: 1.1;
        }

        .chart-center-label {
            font-size: 11px;
            color: var(--text-muted);
            max-width: 110px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-top: 2px;
        }

        /* 图例列表 */
        .legend-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .legend-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .legend-item:hover, .legend-item.active {
            background: var(--bg-surface-hover);
            border-color: var(--border-default);
            transform: translateX(3px);
        }

        .legend-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .legend-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
            gap: 2px;
        }

        .legend-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .legend-sub {
            font-size: 11px;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .legend-right {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .legend-count {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600;
            color: var(--emerald);
        }

        .legend-percent {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-secondary);
            width: 44px;
            text-align: right;
        }

        .empty-chart-box {
            grid-column: span 2;
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .empty-chart-box svg {
            color: var(--text-muted);
            opacity: 0.35;
        }

        /* 反代生成器工具条 */
        .tool-body {
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tool-input-row {
            display: flex;
            gap: 10px;
        }

        .tool-input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .tool-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn-generate {
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            padding: 10px 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-generate:hover {
            background: var(--primary-hover);
        }

        .btn-generate:active {
            transform: scale(0.98);
        }

        .tool-result-row {
            background: var(--bg-input);
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .tool-result-url {
            font-family: var(--font-mono);
            font-size: 13px;
            color: #60a5fa;
            word-break: break-all;
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-default);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* 登录卡片 */
        .login-card {
            width: 100%;
            max-width: 360px;
            margin: 80px auto;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            box-shadow: 0 16px 40px -4px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .login-head {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .login-head-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, #2563eb, #10b981);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

        .login-head h2 {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
        }

        .login-head p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .login-error-box {
            background: var(--rose-bg);
            border: 1px solid rgba(244, 63, 94, 0.25);
            color: #fb7185;
            font-size: 12px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            display: none;
            align-items: center;
            gap: 6px;
        }

        /* 全局 Toast */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast-item {
            background: #192030;
            border: 1px solid var(--border-default);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
            padding: 9px 14px;
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            transform: translateY(10px);
            opacity: 0;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
        }

        .toast-item.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-item.success { border-color: rgba(16, 185, 129, 0.35); }
        .toast-item.success svg { color: var(--emerald); }
        .toast-item.error { border-color: rgba(244, 63, 94, 0.35); }
        .toast-item.error svg { color: var(--rose); }

        .footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            padding-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            body {
                padding: 14px 10px 30px;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .header-tools {
                justify-content: space-between;
                width: 100%;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .stat-card {
                padding: 12px 14px;
                gap: 6px;
            }

            .stat-card-value {
                font-size: 19px;
            }

            .stat-card-footer {
                font-size: 11px;
            }

            .chart-card-body {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 16px;
            }

            .tool-input-row {
                flex-direction: column;
            }

            .tool-result-row {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-copy {
                justify-content: center;
            }

            .card-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .card-extra {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

    <!-- 登录视图 -->
    <div id="login-view" class="login-card" style="display: none;">
        <div class="login-head">
            <div class="login-head-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h2>管理员访问验证</h2>
            <p>请输入身份凭据进入网关控制台</p>
        </div>

        <div class="form-group">
            <label for="login-user">管理账号</label>
            <input type="text" id="login-user" class="tool-input" placeholder="Username" autocomplete="username" />
        </div>

        <div class="form-group">
            <label for="login-pass">访问密码</label>
            <input type="password" id="login-pass" class="tool-input" placeholder="Password" autocomplete="current-password" />
        </div>

        <div id="login-error" class="login-error-box">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="login-error-text">账号或密码错误</span>
        </div>

        <button class="btn-generate" onclick="doLogin()" style="justify-content: center;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                <polyline points="10 17 15 12 10 7"></polyline>
                <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            立即登录
        </button>
    </div>

    <!-- 仪表盘主视图 -->
    <div class="container" id="dashboard-view" style="display: none;">
        <!-- 头部 Header -->
        <header class="header">
            <div class="brand">
                <div class="brand-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                </div>
                <div class="brand-title">
                    <h1>Emby Proxy Toolbox</h1>
                    <p>动态通用流媒体反向代理网关</p>
                </div>
            </div>

            <div class="header-tools">
                <div class="badge-status">
                    <span class="pulse-dot"></span>
                    <span>网关在线</span>
                </div>
                <button class="btn-header" id="btn-tg" onclick="testTgPush()">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                    测试 TG 播报
                </button>
                <button class="btn-header danger" onclick="doLogout()">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <!-- 全局 Toast 容器 -->
    <div id="toast-container"></div>

    <script>
        // 现代暗黑调色板 (7级循环渐变)
        const PALETTE = [
            '#10b981', // 翡翠绿
            '#3b82f6', // 赛博蓝
            '#a855f7', // 紫晶色
            '#f59e0b', // 琥珀黄
            '#06b6d4', // 天空青
            '#f43f5e', // 珊瑚红
            '#8b5cf6'  // 靛青色
        ];

        let currentClientsData = [];
        let currentChartMode = 'device'; // 'device' | 'host'

        // Toast 消息浮层
        function showToast(text, type = 'info') {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = 'toast-item ' + type;

            let iconSvg = '';
            if (type === 'success') {
                iconSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
            } else if (type === 'error') {
                iconSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>';
            } else {
                iconSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>';
            }

            el.innerHTML = iconSvg + '<span>' + escapeHtml(text) + '</span>';
            container.appendChild(el);

            requestAnimationFrame(() => {
                el.classList.add('show');
            });

            setTimeout(() => {
                el.classList.remove('show');
                setTimeout(() => {
                    if (el.parentNode) el.parentNode.removeChild(el);
                }, 200);
            }, 3000);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // 鉴权检查与初始化
        async function checkAuthAndLoad() {
            try {
                const res = await fetch('/api/stats');
                if (res.status === 401) {
                    showLogin();
                    return;
                }
                if (res.ok) {
                    showDashboard();
                    const data = await res.json();
                    renderStats(data);
                    loadClients();
                }
            } catch (e) {
                console.error('加载状态失败:', e);
            }
        }

        function showLogin() {
            document.getElementById('login-view').style.display = 'flex';
            document.getElementById('dashboard-view').style.display = 'none';
        }

        function showDashboard() {
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'flex';
        }

        function renderStats(data) {
            const elTodayPlays = document.getElementById('val-today-plays');
            const elTotalPlays = document.getElementById('val-total-plays');
            const elTodayTraffic = document.getElementById('val-today-traffic');
            const elTotalTraffic = document.getElementById('val-total-traffic');
            const elTodayClients = document.getElementById('val-today-clients');
            const elTotalClients = document.getElementById('val-total-clients');
            const elTodayHosts = document.getElementById('val-today-hosts');
            const elTotalHosts = document.getElementById('val-total-hosts');

            if (elTodayPlays) elTodayPlays.textContent = (data.today_plays || 0).toLocaleString();
            if (elTotalPlays) elTotalPlays.textContent = (data.total_plays || 0).toLocaleString() + ' 次';
            if (elTodayTraffic) elTodayTraffic.textContent = data.today_traffic_fmt || '0 B';
            if (elTotalTraffic) elTotalTraffic.textContent = data.total_traffic_fmt || '0 B';
            if (elTodayClients) elTodayClients.textContent = (data.today_clients || 0).toLocaleString();
            if (elTotalClients) elTotalClients.textContent = (data.total_clients || 0).toLocaleString() + ' 个';
            if (elTodayHosts) elTodayHosts.textContent = (data.today_hosts || 0).toLocaleString();
            if (elTotalHosts) elTotalHosts.textContent = (data.total_hosts || 0).toLocaleString() + ' 个';

            if (data.date) {
                document.getElementById('stat-date-badge').textContent = '统计周期: ' + data.date;
            }
        }

        async function loadClients() {
            try {
                const res = await fetch('/api/clients');
                if (res.status === 401) {
                    showLogin();
                    return;
                }
                if (res.ok) {
                    const data = await res.json();
                    currentClientsData = data.clients || [];
                    renderDonutChart();
                }
            } catch (e) {
                console.error('加载客户端失败:', e);
            }
        }

        function switchChartMode(mode) {
            currentChartMode = mode;
            document.getElementById('tab-dev').classList.toggle('active', mode === 'device');
            document.getElementById('tab-host').classList.toggle('active', mode === 'host');
            renderDonutChart();
        }

        // 绘制原生 SVG 扇形环形图与图例
        function renderDonutChart() {
            const svg = document.getElementById('donut-svg');
            const legendList = document.getElementById('legend-list');
            const centerVal = document.getElementById('center-plays-val');
            const centerLabel = document.getElementById('center-plays-label');

            if (!currentClientsData || currentClientsData.length === 0) {
                svg.innerHTML = '<circle cx="110" cy="110" r="75" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="32" stroke-dasharray="6 6"></circle>';
                legendList.innerHTML = '<div class="empty-chart-box">' +
                    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                    '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>' +
                    '</svg><span>今日暂无设备播放记录</span></div>';
                centerVal.textContent = '0';
                centerLabel.textContent = '今日无播放';
                return;
            }

            // 1. 聚合分组数据
            const groupMap = {};
            let totalPlays = 0;

            currentClientsData.forEach(item => {
                const key = currentChartMode === 'device' ? (item.device_name || '未知设备') : (item.target_host || '未知节点');
                if (!groupMap[key]) {
                    groupMap[key] = {
                        name: key,
                        count: 0,
                        subInfo: currentChartMode === 'device' ? item.client_ip : (item.play_count + ' 次播放')
                    };
                }
                groupMap[key].count += (item.play_count || 0);
                totalPlays += (item.play_count || 0);
            });

            const groups = Object.values(groupMap).sort((a, b) => b.count - a.count);

            centerVal.textContent = totalPlays.toLocaleString();
            centerLabel.textContent = currentChartMode === 'device' ? '今日总播放' : '节点总请求';

            // 2. 绘制 SVG 环形切片
            const cx = 110, cy = 110, R = 84, r = 54;
            let currentAngle = 0;
            let svgPaths = '';
            let legendHTML = '';

            groups.forEach((g, idx) => {
                const color = PALETTE[idx % PALETTE.length];
                const fraction = totalPlays > 0 ? (g.count / totalPlays) : 0;
                const percentText = (fraction * 100).toFixed(1) + '%';
                const angle = fraction * 2 * Math.PI;

                // 如果只有一个切片且占满 100%
                if (groups.length === 1) {
                    svgPaths += '<circle class="donut-slice" data-idx="' + idx + '" cx="110" cy="110" r="69" fill="none" stroke="' + color + '" stroke-width="30" />';
                } else if (angle > 0.001) {
                    const startAngle = currentAngle;
                    const endAngle = currentAngle + angle;

                    // 微小缝隙间距 (0.015 rad)
                    const gap = 0.015;
                    const a1 = startAngle + gap / 2;
                    const a2 = endAngle - gap / 2;

                    const x1 = cx + R * Math.cos(a1);
                    const y1 = cy + R * Math.sin(a1);
                    const x2 = cx + R * Math.cos(a2);
                    const y2 = cy + R * Math.sin(a2);

                    const x3 = cx + r * Math.cos(a2);
                    const y3 = cy + r * Math.sin(a2);
                    const x4 = cx + r * Math.cos(a1);
                    const y4 = cy + r * Math.sin(a1);

                    const largeArc = (a2 - a1) > Math.PI ? 1 : 0;

                    const d = [
                        'M', x1, y1,
                        'A', R, R, 0, largeArc, 1, x2, y2,
                        'L', x3, y3,
                        'A', r, r, 0, largeArc, 0, x4, y4,
                        'Z'
                    ].join(' ');

                    svgPaths += '<path class="donut-slice" data-idx="' + idx + '" d="' + d + '" fill="' + color + '" />';
                    currentAngle = endAngle;
                }

                // 3. 生成对应图例条目
                legendHTML += '<div class="legend-item" data-idx="' + idx + '" onmouseenter="highlightSlice(' + idx + ')" onmouseleave="unhighlightSlice()">' +
                    '<div class="legend-left">' +
                    '<span class="legend-dot" style="background-color: ' + color + '; box-shadow: 0 0 8px ' + color + '66;"></span>' +
                    '<div class="legend-info">' +
                    '<span class="legend-name">' + escapeHtml(g.name) + '</span>' +
                    '<span class="legend-sub">' + (currentChartMode === 'device' ? 'IP: ' + g.subInfo : '目标服务节点') + '</span>' +
                    '</div>' +
                    '</div>' +
                    '<div class="legend-right">' +
                    '<span class="legend-count">' + g.count.toLocaleString() + ' 次</span>' +
                    '<span class="legend-percent">' + percentText + '</span>' +
                    '</div>' +
                    '</div>';
            });

            svg.innerHTML = svgPaths;
            legendList.innerHTML = legendHTML;

            // 给所有切片绑定交互事件
            svg.querySelectorAll('.donut-slice').forEach(slice => {
                slice.addEventListener('mouseenter', () => {
                    const idx = parseInt(slice.getAttribute('data-idx'), 10);
                    highlightSlice(idx);
                });
                slice.addEventListener('mouseleave', unhighlightSlice);
            });

            window._currentChartGroups = groups;
            window._totalPlays = totalPlays;
        }

        function highlightSlice(idx) {
            const groups = window._currentChartGroups;
            if (!groups || !groups[idx]) return;

            const g = groups[idx];
            const centerVal = document.getElementById('center-plays-val');
            const centerLabel = document.getElementById('center-plays-label');

            centerVal.textContent = g.count.toLocaleString();
            centerLabel.textContent = g.name;

            document.querySelectorAll('.donut-slice').forEach(el => {
                const elIdx = parseInt(el.getAttribute('data-idx'), 10);
                if (elIdx === idx) {
                    el.classList.add('active');
                } else {
                    el.style.opacity = '0.35';
                }
            });

            document.querySelectorAll('.legend-item').forEach(el => {
                const elIdx = parseInt(el.getAttribute('data-idx'), 10);
                el.classList.toggle('active', elIdx === idx);
            });
        }

        function unhighlightSlice() {
            const centerVal = document.getElementById('center-plays-val');
            const centerLabel = document.getElementById('center-plays-label');
            const total = window._totalPlays || 0;

            centerVal.textContent = total.toLocaleString();
            centerLabel.textContent = currentChartMode === 'device' ? '今日总播放' : '节点总请求';

            document.querySelectorAll('.donut-slice').forEach(el => {
                el.classList.remove('active');
                el.style.opacity = '1';
            });

            document.querySelectorAll('.legend-item').forEach(el => {
                el.classList.remove('active');
            });
        }

        // 登录操作
        async function doLogin() {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            const errBox = document.getElementById('login-error');
            const errText = document.getElementById('login-error-text');
            errBox.style.display = 'none';

            if (!u || !p) {
                errText.textContent = '请输入管理员账号和密码';
                errBox.style.display = 'flex';
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: u, password: p})
                });
                const result = await res.json();
                if (result.success) {
                    showToast('登录成功', 'success');
                    checkAuthAndLoad();
                } else {
                    errText.textContent = result.message || '账号或密码错误';
                    errBox.style.display = 'flex';
                }
            } catch (e) {
                errText.textContent = '登录网络异常，请稍后重试';
                errBox.style.display = 'flex';
            }
        }

        async function doLogout() {
            try {
                await fetch('/api/logout', {method: 'POST'});
            } catch(e) {}
            showToast('已安全退出', 'info');
            setTimeout(() => {
                location.reload();
            }, 500);
        }

        // 测试 Telegram 推送
        async function testTgPush() {
            const btn = document.getElementById('btn-tg');
            if (btn.classList.contains('loading')) return;

            btn.classList.add('loading');
            btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg> 发送中...';

            try {
                const res = await fetch('/api/test-tg', {method: 'POST'});
                const data = await res.json();
                if (data.success) {
                    showToast('Telegram 测试报告已发送成功', 'success');
                } else {
                    showToast(data.message || '发送失败，请检查 Bot Token 或 Chat ID', 'error');
                }
            } catch(e) {
                showToast('网络请求失败', 'error');
            } finally {
                btn.classList.remove('loading');
                btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg> 测试 TG 播报';
            }
        }

        // 链接生成
        function generateLink() {
            const input = document.getElementById('target-input');
            const val = input.value.trim();
            if (!val) {
                showToast('请输入原始 Emby/Jellyfin 地址', 'error');
                input.focus();
                return;
            }

            let clean = val;
            let protocol = 'http';

            if (clean.startsWith('https://')) {
                protocol = 'https';
                clean = clean.substring(8);
            } else if (clean.startsWith('http://')) {
                protocol = 'http';
                clean = clean.substring(7);
            }

            while (clean.endsWith('/')) {
                clean = clean.slice(0, -1);
            }

            const origin = window.location.origin;
            const result = origin + '/' + protocol + '://' + clean;
            document.getElementById('output-url').textContent = result;
            document.getElementById('output-wrapper').style.display = 'flex';
            showToast('代理链接生成成功', 'success');
        }

        // 复制链接
        function copyResult() {
            const url = document.getElementById('output-url').textContent;
            if (!url) return;

            navigator.clipboard.writeText(url).then(() => {
                showToast('已复制到剪贴板', 'success');
                const copyText = document.getElementById('copy-text');
                copyText.textContent = '已复制';
                setTimeout(() => { copyText.textContent = '复制链接'; }, 2000);
            }).catch(() => {
                showToast('复制失败，请手动选择复制', 'error');
            });
        }

        document.getElementById('login-pass').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doLogin();
        });

        // 启动加载与定时刷新 (8s)
        checkAuthAndLoad();
        setInterval(checkAuthAndLoad, 8000);
    </script>
</body>
</html>
